name: Signing diagnostic
on:
  push:
    branches: ['ci/#49-diagnose-Devin']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: xcode-27
    steps:
      - name: Inspect signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cert="$RUNNER_TEMP/cert.p12"
          pem="$RUNNER_TEMP/cert.pem"
          keychain="$RUNNER_TEMP/diagnostic.keychain-db"
          pass="$(openssl rand -hex 32)"
          echo "::add-mask::$pass"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -f "$cert" "$pem"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security create-keychain -p "$pass" "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$cert" -P "$P12_PASSWORD" -k "$keychain" -T /usr/bin/codesign >/dev/null
          echo 'Code signing identities:'
          security find-identity -v -p codesigning "$keychain"
          openssl pkcs12 -in "$cert" -clcerts -nokeys -passin env:P12_PASSWORD -out "$pem"
          echo 'Certificate details:'
          openssl x509 -in "$pem" -noout -subject -issuer -dates
          if openssl x509 -in "$pem" -checkend 0 -noout >/dev/null; then echo 'Certificate is unexpired'; else echo 'Certificate is expired'; exit 1; fi
