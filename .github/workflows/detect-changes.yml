name: CI Changes

on:
  workflow_call:
    outputs:
      build:
        description: Whether the changed files require an app build
        value: ${{ jobs.detect.outputs.build }}
      lint:
        description: Whether the changed files require SwiftLint
        value: ${{ jobs.detect.outputs.lint }}

permissions:
  contents: read

jobs:
  detect:
    name: changed-files
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      lint: ${{ steps.decide.outputs.lint }}
    steps:
      - name: Checkout for file comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide required checks
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess

          def classify(path):
              path = path.lower()
              if path == '.github/workflows/detect-changes.yml':
                  return True, True, '공통 변경 판별 로직'
              if path == '.github/workflows/build.yml':
                  return True, False, 'Build 워크플로'
              if path == '.github/workflows/swiftlint.yml' or path.rsplit('/', 1)[-1] in (
                  '.swiftlint.yml', '.swiftlint.yaml'
              ):
                  return False, True, 'SwiftLint 설정 또는 워크플로'
              if path.endswith('.swift'):
                  return True, True, 'Swift 소스'
              app_roots = ('researchers/', 'researchwatchapp/', 'packages/', 'researchers.xcodeproj/')
              build_files = (
                  '.xcconfig', '.entitlements', '.plist', '.storyboard', '.xib',
                  '.xcstrings', '.strings', 'package.resolved'
              )
              if (path.startswith(app_roots) or path.endswith(build_files)
                  or '.xcodeproj/' in path or '.xcworkspace/' in path or '.xcassets/' in path):
                  return True, False, '프로젝트·패키지·리소스'
              metadata = {
                  '.gitignore', '.github/codeowners', '.coderabbit.yaml', '.coderabbit.yml',
                  '.github/workflows/auto-assign.yml', '.github/workflows/main-branch-guard.yml'
              }
              if (path.startswith(('docs/', '.github/issue_template/'))
                  or path.endswith(('.md', '.mdx', '.rst')) or path in metadata):
                  return False, False, '문서·협업 설정'
              return True, True, '분류되지 않은 파일: 안전하게 실행'

          build_reasons, lint_reasons = set(), set()
          changed_count = None
          try:
              base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
              if not all(re.fullmatch(r'[0-9a-fA-F]{40,64}', sha) and set(sha) != {'0'}
                         for sha in (base, head)):
                  raise ValueError('Unavailable comparison commits')
              separator = '...' if os.environ['IS_PR'] == 'true' else '..'
              raw = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--no-renames', '-z', base + separator + head],
                  stderr=subprocess.PIPE
              )
              paths = [path.decode('utf-8', errors='surrogateescape') for path in raw.split(b'\0') if path]
              changed_count = len(paths)
              for path in paths:
                  build, lint, reason = classify(path)
                  if build:
                      build_reasons.add(reason)
                  if lint:
                      lint_reasons.add(reason)
          except (KeyError, ValueError, OSError, subprocess.CalledProcessError):
              print('::warning::Changed-file detection failed; running Build and SwiftLint.')
              build_reasons.add('변경 범위를 확인할 수 없어 실행')
              lint_reasons.add('변경 범위를 확인할 수 없어 실행')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('build=' + str(bool(build_reasons)).lower() + '\n')
              output.write('lint=' + str(bool(lint_reasons)).lower() + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## 변경 파일 기준 CI 실행\n\n')
              summary.write('변경 경로 수: ' + str(changed_count if changed_count is not None else '확인 불가') + '\n\n')
              summary.write('| 검사 | 결정 | 사유 |\n| --- | --- | --- |\n')
              for name, reasons in [('Build', build_reasons), ('SwiftLint', lint_reasons)]:
                  decision = '실행' if reasons else '건너뜀'
                  reason = ', '.join(sorted(reasons)) if reasons else '관련 빌드·lint 입력 변경 없음'
                  summary.write('| ' + name + ' | ' + decision + ' | ' + reason + ' |\n')
          PY
