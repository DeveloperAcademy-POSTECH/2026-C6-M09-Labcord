name: Build

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/detect-changes.yml

  build:
    name: build
    needs: changes
    if: ${{ always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.build == 'true') }}
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Identify compilation cache environment
        if: github.event_name == 'pull_request'
        id: cache-environment
        run: |
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
          echo "toolchain=$( { xcodebuild -version; xcrun --sdk iphonesimulator --show-sdk-build-version; xcrun --sdk watchsimulator --show-sdk-build-version; printf '%s\n%s\n' "$ImageOS" "$ImageVersion"; } | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore compilation cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/labcord-compilation-cache
          key: swift-compilation-v1-${{ runner.os }}-${{ steps.cache-environment.outputs.arch }}-${{ steps.cache-environment.outputs.toolchain }}-${{ hashFiles('Researchers.xcodeproj/project.pbxproj', 'Researchers.xcodeproj/xcshareddata/xcschemes/*.xcscheme', '**/Package.swift', '**/Package.resolved', '.github/workflows/build.yml') }}-pr${{ github.event.pull_request.number }}-${{ github.sha }}
          restore-keys: |
            swift-compilation-v1-${{ runner.os }}-${{ steps.cache-environment.outputs.arch }}-${{ steps.cache-environment.outputs.toolchain }}-${{ hashFiles('Researchers.xcodeproj/project.pbxproj', 'Researchers.xcodeproj/xcshareddata/xcschemes/*.xcscheme', '**/Package.swift', '**/Package.resolved', '.github/workflows/build.yml') }}-pr${{ github.event.pull_request.number }}-

      - name: Build
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$EVENT_NAME" = 'pull_request' ]; then
            args+=(ARCHS=arm64 COMPILATION_CACHE_ENABLE_CACHING=YES "COMPILATION_CACHE_CAS_PATH=$RUNNER_TEMP/labcord-compilation-cache")
          fi
          xcodebuild build \
            -project Researchers.xcodeproj \
            -scheme Researchers \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation "${args[@]}"
